[tool.poetry]
name = "jldev_poetry"
packages = [
    { include = "pytools", from = "src"},
]
version = "0.1.0"
description = "Enhance your JOps (= Julia + Python/Poetry + VSCode + JupyterLab + Docker + Pluto)"
authors = ["SatoshiTerasaki <terasakisatoshi.math@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
Pillow = ">=13.0.0,<14.0.0"
matplotlib = "^3.9.2"
numpy = "^1.26.4"
sympy = "^1.9"
pandas = "^2.2.0"
scipy = "^1.10.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
ipykernel = "^6.29.2"
ipywidgets = "^8.1.2"
isort = "^5.10.1"
jupyter = "^1.1.1"
notebook = "^7.6.3"
jupyterlab = "^4.6.4"
jupyter-pluto-proxy = {git = "https://github.com/IllumiDesk/jupyter-pluto-proxy.git", rev = "main"}
jupyterlab-code-formatter = "^3.1.0"
jupytext = "^1.13.3"
mypy = "^1.8"
nbconvert = "^7.17.2"
poethepoet = "^0.26.1"
pytest = "^8.3"
jupyterlab-topbar-text = "^1.1.0"
jupyter-server-proxy = "^4.2.0"
tokenize-rt = "^5.2.0"
ipython = "^8.12.3"

[tool.poe.tasks]
test = "pytest"
mypy = { shell = "mypy ." }
black = { shell = "black . && black playground/notebook" }
sync = { shell = "jupytext --sync playground/notebook/**/*.ipynb" }
format = ["black", "sync"]
lab = { shell = "jupyter lab" }

[tool.pytest.ini_options]
testpaths=[
	"test",
]

[tool.black]
line-length = 120
exclude = '''
/(
  | \.git
  | \.mypy_cache
  | \.venv
)/
'''

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
